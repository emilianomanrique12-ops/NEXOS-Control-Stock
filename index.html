<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>NEXOS · Accesorios Musicales</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#151515;font-size:16px}
header{background:#fff;padding:16px 16px 10px;text-align:center;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
header img{width:52px;height:52px;object-fit:contain}header h1{font-size:22px;margin:5px 0 0}header small{font-size:13px;letter-spacing:.7px;color:#666}
main{max-width:760px;margin:auto;padding:12px 10px 90px}.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.right{text-align:right}
h2{font-size:20px;margin:10px 0}.muted{color:#777;font-size:13px}.money{font-weight:800;font-size:18px}
.stock{font-size:28px;font-weight:900;line-height:1}.ok{color:#16833b}.warn{color:#c87900}.bad{color:#c21d1d}
.product-name{font-size:17px;font-weight:800}.desc{font-size:14px;color:#666;margin-top:3px}
.prices{display:flex;justify-content:space-between;border-top:1px solid #eee;margin-top:10px;padding-top:8px;font-size:13px}
button{border:0;border-radius:10px;padding:11px 13px;font-size:15px;font-weight:700;background:#e9e9e9;color:#111}
button.primary{background:#111;color:#fff}button.danger{background:#b91c1c;color:#fff}
input,select{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font-size:16px;margin-top:5px}
label{display:block;margin:9px 0;font-size:14px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ccc;display:flex;z-index:10}
nav button{flex:1;border-radius:0;background:#fff;padding:12px 4px;font-size:13px}.navon{font-weight:900;background:#eee}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.itemline{display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:10px;padding:9px;margin:6px 0}.itemline input{width:80px;margin:0}
.toast{position:fixed;left:10px;right:10px;bottom:70px;background:#111;color:#fff;padding:12px;border-radius:10px;display:none;z-index:30}
.search{margin-bottom:8px}
</style>
</head>
<body>
<header>
  <img id="logo" src="nexos_logo.png" alt="NEXOS">
  <h1>NEXOS</h1><small>ACCESORIOS MUSICALES</small>
</header>

<main>
<section id="summary" class="page active">
<h2>Resumen</h2>
<div class="statgrid">
<div class="stat">Ventas hoy<b id="vToday">$0</b></div>
<div class="stat">Ventas semana<b id="vWeek">$0</b></div>
<div class="stat">Ventas mes<b id="vMonth">$0</b></div>
<div class="stat">Ganancia mes<b id="pMonth">$0</b></div>
<div class="stat">Valor stock costo<b id="stockCost">$0</b></div>
<div class="stat">Valor stock venta<b id="stockSale">$0</b></div>
</div>
<div class="card"><b>Unidades vendidas</b><div id="unitsSold" class="money">0</div></div>
<div class="card"><b>Productos para reponer</b><div id="reorderList" class="muted">Ninguno</div></div>
<div class="actions"><button class="primary" onclick="openSale()">＋ NUEVA VENTA</button><button onclick="openPurchase()">＋ NUEVA COMPRA</button></div>
</section>

<section id="stock" class="page">
<h2>Stock</h2>
<input class="search" id="search" placeholder="Buscar producto..." oninput="renderStock()">
<div id="stockList"></div>
<div class="actions"><button class="primary" onclick="newProduct()">＋ NUEVO ARTÍCULO</button></div>
</section>

<section id="moves" class="page">
<h2>Movimientos</h2>
<div class="actions">
<button onclick="setMoveFilter('all')">Todos</button><button onclick="setMoveFilter('sale')">Ventas</button><button onclick="setMoveFilter('purchase')">Compras</button>
</div>
<div id="moveList"></div>
</section>
</main>

<nav>
<button id="nav-summary" class="navon" onclick="go('summary')">📊<br>Resumen</button>
<button id="nav-stock" onclick="go('stock')">📦<br>Stock</button>
<button id="nav-moves" onclick="go('moves')">🧾<br>Movimientos</button>
</nav>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY="nexos_control_stock_v2";
const RECOVERY_KEY="nexos_recovery_last_import";
let state={products:[],movements:[]};
let moveFilter="all";

function money(n){return "$"+Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:0})}
function uid(){return "id_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)}
function normProduct(p,i){
 return {id:String(p.id||uid()),name:String(p.name??p.nombre??p.title??""),
 description:String(p.description??p.desc??p.descripcion??""),
 cost:Number(p.cost??p.costPrice??p.precioCosto??0)||0,
 sale:Number(p.sale??p.salePrice??p.precioVenta??0)||0,
 stock:Number(p.stock??p.quantity??p.cantidad??0)||0,
 min:Number(p.min??p.minStock??p.minimum??0)||0,
 target:Number(p.target??p.targetStock??p.reorderTarget??p.objetivo??0)||0};
}
function normalize(raw){
 if(!raw||typeof raw!=="object") throw Error("El archivo no contiene un JSON válido.");
 let ps=raw.products||raw.items||raw.articulos||raw.productos;
 if(!Array.isArray(ps)) throw Error("No encontré una lista de productos reconocible.");
 let ms=raw.movements||raw.movs||raw.transactions||raw.movimientos||[];
 if(!Array.isArray(ms)) ms=[];
 let out={products:ps.map(normProduct),movements:ms};
 if(!out.products.length) throw Error("El respaldo no contiene productos.");
 return out;
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function load(){
 let candidates=[localStorage.getItem(KEY),localStorage.getItem(RECOVERY_KEY)];
 for(const s of candidates){
  if(!s) continue;
  try{const d=normalize(JSON.parse(s));state=d;save();return true}catch(e){}
 }
 state={products:[],movements:[]};save();return false;
}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2600)}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function openSheet(content){document.getElementById("sheet").innerHTML=content;document.getElementById("modal").classList.add("open")}
function go(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(page).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("navon"));
 document.getElementById("nav-"+page).classList.add("navon");
 if(page==="summary")renderSummary();if(page==="stock")renderStock();if(page==="moves")renderMoves();
}
function status(p){if(p.stock<=0)return "bad";if(p.min>0&&p.stock<=p.min)return "warn";return "ok"}
function statusText(p){if(p.stock<=0)return "SIN STOCK";if(p.min>0&&p.stock<=p.min)return "REPOSICIÓN";return "OK"}
function renderStock(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();
 const list=state.products.filter(p=>(p.name+" "+p.description).toLowerCase().includes(q));
 document.getElementById("stockList").innerHTML=list.map(p=>`
 <div class="card"><div class="row">
   <div class="grow"><div class="product-name">${esc(p.name)}</div><div class="desc">${esc(p.description)}</div></div>
   <div class="right"><div class="stock ${status(p)}">${p.stock}</div><div class="muted">${statusText(p)}</div><button onclick="editProduct('${p.id}')">⚙️</button></div>
 </div>
 <div class="prices"><span>Precio costo: <b>${money(p.cost)}</b></span><span>Precio venta: <b>${money(p.sale)}</b></span></div></div>`).join("") || '<div class="card">No hay artículos.</div>';
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function renderSummary(){
 const now=new Date(), startDay=new Date(now);startDay.setHours(0,0,0,0);
 const week=new Date(startDay);week.setDate(week.getDate()-((week.getDay()+6)%7));
 const month=new Date(now.getFullYear(),now.getMonth(),1);
 let vals={day:0,week:0,month:0,profit:0,units:0};
 for(const m of state.movements){
  if(m.type!=="sale")continue;
  const d=new Date(m.date||m.createdAt||0), total=Number(m.total||0), profit=Number(m.profit||0);
  if(d>=startDay)vals.day+=total;if(d>=week)vals.week+=total;if(d>=month){vals.month+=total;vals.profit+=profit}
  vals.units+=(m.items||[]).reduce((a,x)=>a+Number(x.qty||0),0);
 }
 document.getElementById("vToday").textContent=money(vals.day);document.getElementById("vWeek").textContent=money(vals.week);
 document.getElementById("vMonth").textContent=money(vals.month);document.getElementById("pMonth").textContent=money(vals.profit);
 document.getElementById("unitsSold").textContent=vals.units;
 const r=state.products.filter(p=>p.min>0&&p.stock<=p.min).map(p=>`${esc(p.name)}: comprar ${Math.max(0,p.target-p.stock)}`).join("<br>");
 document.getElementById("reorderList").innerHTML=r||"Ninguno";
 document.getElementById("stockCost").textContent=money(state.products.reduce((a,p)=>a+p.stock*p.cost,0));
 document.getElementById("stockSale").textContent=money(state.products.reduce((a,p)=>a+p.stock*p.sale,0));
}
function renderMoves(){
 const arr=state.movements.filter(m=>moveFilter==="all"||m.type===moveFilter).slice().reverse();
 document.getElementById("moveList").innerHTML=arr.map(m=>`
 <div class="card"><div class="row"><div class="grow"><b>${m.type==="sale"?"VENTA":"COMPRA"} · ${new Date(m.date||Date.now()).toLocaleString("es-AR")}</b>
 <div class="muted">${(m.items||[]).map(x=>esc(x.name)+" × "+x.qty).join(" · ")}</div></div>
 <b>${money(m.total)}</b></div>
 <div class="actions"><button onclick="editMove('${m.id}')">Editar</button><button class="danger" onclick="deleteMove('${m.id}')">Eliminar</button></div></div>`).join("")||'<div class="card">No hay movimientos.</div>';
}
function setMoveFilter(x){moveFilter=x;renderMoves()}
function newProduct(p={}){
 openSheet(`<h2>${p.id?"Editar artículo":"Nuevo artículo"}</h2>
 <label>Nombre<input id="pn" value="${esc(p.name||"")}"></label>
 <label>Descripción<input id="pd" value="${esc(p.description||"")}"></label>
 <label>Precio costo<input id="pc" type="number" value="${p.cost??0}"></label>
 <label>Precio venta<input id="pv" type="number" value="${p.sale??0}"></label>
 <label>Stock actual<input id="ps" type="number" value="${p.stock??0}"></label>
 <label>Stock mínimo<input id="pmin" type="number" value="${p.min??0}"></label>
 <label>Stock objetivo<input id="pt" type="number" value="${p.target??0}"></label>
 <div class="actions"><button class="primary" onclick="saveProduct('${p.id||""}')">GUARDAR</button><button onclick="closeModal()">Cancelar</button></div>`);
}
function editProduct(id){const p=state.products.find(x=>x.id===id);if(p)newProduct(p)}
function saveProduct(id){
 const p={id:id||uid(),name:document.getElementById("pn").value.trim(),description:document.getElementById("pd").value.trim(),
 cost:Number(document.getElementById("pc").value)||0,sale:Number(document.getElementById("pv").value)||0,stock:Number(document.getElementById("ps").value)||0,
 min:Number(document.getElementById("pmin").value)||0,target:Number(document.getElementById("pt").value)||0};
 if(!p.name){toast("Escribí un nombre.");return}
 const ix=state.products.findIndex(x=>x.id===p.id);if(ix>=0)state.products[ix]=p;else state.products.push(p);
 save();closeModal();renderAll();toast("Artículo guardado correctamente.");
}
function openSale(){openTransaction("sale")}
function openPurchase(){openTransaction("purchase")}
function openTransaction(type,existing){
 let items=existing?.items||[];
 openSheet(`<h2>${type==="sale"?"Nueva venta":"Nueva compra"}</h2>
 <input id="txSearch" placeholder="Buscar producto..." oninput="txProducts()" value="">
 <div id="txProducts"></div><div id="txItems"></div>
 <div class="card"><b>Total: <span id="txTotal">$0</span></b></div>
 <div class="actions"><button class="primary" onclick="saveTransaction('${type}','${existing?.id||""}')">REGISTRAR</button><button onclick="closeModal()">Cancelar</button></div>`);
 window.txItems=items.map(x=>({...x}));window.txExisting=existing||null;txProducts();renderTxItems();
}
function txProducts(){
 const q=(document.getElementById("txSearch")?.value||"").toLowerCase();
 document.getElementById("txProducts").innerHTML=state.products.filter(p=>p.name.toLowerCase().includes(q)).slice(0,10)
 .map(p=>`<button style="margin:3px" onclick="addTxItem('${p.id}')">${esc(p.name)}</button>`).join("");
}
function addTxItem(id){const p=state.products.find(x=>x.id===id);if(!p)return;const x=window.txItems.find(x=>x.productId===id);if(x)x.qty++;else window.txItems.push({productId:id,name:p.name,qty:1,price:p.sale,cost:p.cost});renderTxItems()}
function renderTxItems(){
 const el=document.getElementById("txItems");if(!el)return;
 el.innerHTML=window.txItems.map((x,i)=>`<div class="itemline"><div class="grow"><b>${esc(x.name)}</b><br><span class="muted">${money(x.price)} c/u</span></div><input type="number" min="1" value="${x.qty}" onchange="txQty(${i},this.value)"><button onclick="txRemove(${i})">✕</button></div>`).join("");
 document.getElementById("txTotal").textContent=money(window.txItems.reduce((a,x)=>a+x.qty*x.price,0));
}
function txQty(i,v){window.txItems[i].qty=Math.max(1,Number(v)||1);renderTxItems()}
function txRemove(i){window.txItems.splice(i,1);renderTxItems()}
function saveTransaction(type,id){
 if(!window.txItems.length){toast("Agregá al menos un artículo.");return}
 const existing=state.movements.find(m=>m.id===id);
 // Revert an existing operation before applying the edited one.
 if(existing){
  for(const it of existing.items||[]){const p=state.products.find(p=>p.id===it.productId);if(p)p.stock += existing.type==="sale"?it.qty:-it.qty}
 }
 const items=window.txItems.map(x=>({...x}));
 if(type==="sale"){
  for(const it of items){const p=state.products.find(p=>p.id===it.productId);if(!p||p.stock<it.qty){toast("Stock insuficiente en "+(p?.name||it.name));return}}
  for(const it of items){state.products.find(p=>p.id===it.productId).stock-=it.qty}
 }else{
  for(const it of items){state.products.find(p=>p.id===it.productId).stock+=it.qty}
 }
 const total=items.reduce((a,x)=>a+x.qty*x.price,0), profit=type==="sale"?items.reduce((a,x)=>a+x.qty*(x.price-x.cost),0):0;
 const mv={id:id||uid(),type,date:existing?.date||new Date().toISOString(),items,total,profit};
 if(existing){Object.assign(existing,mv)}else state.movements.push(mv);
 save();closeModal();renderAll();toast(type==="sale"?"Venta registrada.":"Compra registrada.");
}
function editMove(id){const m=state.movements.find(x=>x.id===id);if(m)openTransaction(m.type,m)}
function deleteMove(id){
 const m=state.movements.find(x=>x.id===id);if(!m)return;
 if(!confirm("¿Eliminar esta operación? El stock será recalculado."))return;
 for(const it of m.items||[]){const p=state.products.find(p=>p.id===it.productId);if(p)p.stock+=m.type==="sale"?it.qty:-it.qty}
 state.movements=state.movements.filter(x=>x.id!==id);save();renderAll();toast("Movimiento eliminado.");
}
function exportBackup(){
 const blob=new Blob([JSON.stringify({app:"NEXOS",schema:9,version:9,exportedAt:new Date().toISOString(),products:state.products,movements:state.movements},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="NEXOS_Respaldo_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href);
}
function importBackup(){
 const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
 input.onchange=async()=>{try{
   const text=await input.files[0].text();let raw=JSON.parse(text);let d=normalize(raw);
   if(!confirm(`Respaldo reconocido: ${d.products.length} productos y ${d.movements.length} movimientos.\n\n¿Importar estos datos?`))return;
   state=d;localStorage.setItem(RECOVERY_KEY,JSON.stringify(d));save();renderAll();toast("Datos importados correctamente.");
 }catch(e){alert("No se pudo importar el respaldo: "+e.message)}};
 input.click();
}
function settings(){
 openSheet(`<h2>Configuración</h2>
 <div class="actions"><button onclick="exportBackup()">💾 Exportar respaldo</button><button onclick="importBackup()">📥 Importar respaldo</button></div>
 <div class="card"><b>Datos actuales</b><div class="muted">${state.products.length} productos · ${state.movements.length} movimientos</div></div>
 <button onclick="closeModal()">Cerrar</button>`);
}
function renderAll(){renderSummary();renderStock();renderMoves()}
function boot(){
 load();
 // Add settings access unobtrusively to header.
 const h=document.querySelector("header");const b=document.createElement("button");b.textContent="⚙️";b.style.position="absolute";b.style.right="10px";b.style.top="16px";b.onclick=settings;h.appendChild(b);
 renderAll();
}
boot();
</script>
</body></html>
